name: Señales de mercado (RS Rating y próximos balances)

# Corre todos los dias habiles a las 22:30 UTC (19:30 ART), una hora despues de que termina el job
# diario de precio de Valuacion por Multiplos (21:30 UTC), asi lee su precios_historia.json ya
# actualizado. Calcula el RS Rating 1-99 de cada accion del universo y baja el calendario publico
# de earnings de Nasdaq (ver .github/scripts/mercado_senales.py). Tambien se puede correr a mano
# desde la pestaña "Actions" (boton "Run workflow").
on:
  schedule:
    - cron: '30 22 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

# mismo grupo que los jobs de Valuacion por Multiplos: nunca dos a la vez tocando data/
concurrency:
  group: valuacion-multiplos
  cancel-in-progress: false

jobs:
  senales:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install pandas openpyxl requests

      - name: Calcular RS Rating y bajar earnings
        run: python .github/scripts/mercado_senales.py

      - name: Commitear y pushear si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/rs_cedears.json data/earnings.json
          if git diff --cached --quiet; then
            echo "Sin cambios, no hay nada para commitear."
            exit 0
          fi
          git commit -m "Señales de mercado: RS Rating y earnings ($(date +%Y-%m-%d))"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "push rechazado, reintento $i ..."
            sleep 5
          done
          echo "no se pudo pushear tras 5 intentos" && exit 1
