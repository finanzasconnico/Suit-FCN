name: Actualizar futuros de dolar (A3 + A3500)

# Guarda data/futuros_dolar.json (curva de futuros de dolar de A3 + dolar oficial A3500 del BCRA) para
# "¿Pesos o dolares?". Corre los dias habiles despues del cierre de A3 (21:00 UTC = 18:00 ART; los precios de
# ajuste se publican al cierre) y tambien a mano desde "Actions" → "Run workflow".
# Si alguna fuente cambia de formato el script aborta (exit 3) y NO pisa el JSON bueno.
on:
  schedule:
    - cron: '0 21 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: futuros-dolar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generar data/futuros_dolar.json
        run: node .github/scripts/futuros_dolar.js

      - name: Commit y push si cambio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/futuros_dolar.json
          if git diff --cached --quiet; then
            echo "Sin cambios en futuros_dolar.json"
            exit 0
          fi
          git commit -m "Futuros de dolar ($(date +%Y-%m-%d))"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            echo "push rechazado, reintento $i ..."
            sleep 5
          done
          echo "no se pudo pushear tras 5 intentos" && exit 1
