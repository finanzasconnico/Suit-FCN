name: Actualizar Valuacion por Multiplos

# Corre 1 vez por semana (lunes 06:30 UTC = 03:30 ART) y a mano desde la pestaña
# "Actions" (boton "Run workflow"). Fuente unica: Yahoo Finance via yfinance —
# gratis, sin API key, sin limite diario. El script cachea el avance en
# .github/scripts/.cache_valuacion_multiplos.json (se commitea) y solo refresca
# los tickers con mas de 6 dias.
on:
  schedule:
    - cron: '30 6 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: valuacion-multiplos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install yfinance pandas openpyxl --upgrade

      - name: Generar valuacion_multiplos.xlsx
        run: python .github/scripts/valuacion_multiplos.py

      - name: Commitear y pushear si cambio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/valuacion_multiplos.xlsx .github/scripts/.cache_valuacion_multiplos.json
          if git diff --cached --quiet; then
            echo "Sin cambios, no hay nada para commitear."
          else
            git commit -m "Actualizacion automatica de Valuacion por Multiplos ($(date +%Y-%m-%d))"
            git push
          fi
