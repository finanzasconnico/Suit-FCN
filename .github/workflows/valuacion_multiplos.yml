name: Actualizar Valuacion por Multiplos

# Corre 1 vez por semana (lunes 06:30 UTC = 03:30 ART) y a mano desde la pestaña
# "Actions" (boton "Run workflow"). Fuentes: Yahoo Finance (yfinance) para precios,
# medias moviles y multiplo actual + SEC EDGAR (companyfacts XBRL) para la serie
# historica larga de fundamentales de los emisores US. Las dos gratis, sin API key.
# El script cachea el avance en .github/scripts/.cache_valuacion_multiplos.json (se
# commitea) y solo refresca los tickers con mas de 6 dias. El caché de EDGAR
# (.cache_edgar/, varios GB) NO se commitea — se guarda con actions/cache por mes.
on:
  schedule:
    - cron: '30 6 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: valuacion-multiplos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install yfinance pandas openpyxl --upgrade

      - name: Mes actual (para la key del caché)
        id: mes
        run: echo "ym=$(date +%Y-%m)" >> "$GITHUB_OUTPUT"

      # companyfacts de EDGAR: ~5-30 MB por empresa. La key es unica por corrida
      # (siempre guarda un snapshot nuevo al final); restore-keys agarra el mas
      # reciente del mes, o cualquiera si el mes recien arranca. El modulo igual
      # re-baja solo lo que tiene mas de 20 dias (EDGAR_FRESH_DAYS).
      - name: Cache EDGAR companyfacts
        uses: actions/cache@v4
        with:
          path: .github/scripts/.cache_edgar
          key: edgar-${{ steps.mes.outputs.ym }}-${{ github.run_id }}
          restore-keys: |
            edgar-${{ steps.mes.outputs.ym }}-
            edgar-

      - name: Generar valuacion_multiplos.xlsx
        run: python .github/scripts/valuacion_multiplos.py

      - name: Commitear y pushear si cambio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/valuacion_multiplos.xlsx data/valuacion_multiplos_prev.xlsx .github/scripts/.cache_valuacion_multiplos.json
          if git diff --cached --quiet; then
            echo "Sin cambios, no hay nada para commitear."
            exit 0
          fi
          git commit -m "Actualizacion automatica de Valuacion por Multiplos ($(date +%Y-%m-%d))"
          # reintenta con rebase por si alguien pusheo a main mientras corria el bot
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "push rechazado, reintento $i ..."
            sleep 5
          done
          echo "no se pudo pushear tras 5 intentos" && exit 1
