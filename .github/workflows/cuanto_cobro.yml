name: Actualizar cuanto_cobro.json

# Regenera data/cuanto_cobro.json (el JSON compacto que usa la pagina publica "¿Cuanto cobro?") cada vez
# que se sube un data/monitor.xlsx nuevo, o si cambia el parser. Usa el MISMO codigo que la pantalla
# (fcn-letras.js / fcn-bonos.js): no hay una segunda implementacion que se pueda desincronizar.
# Si el Monitor cambia de formato y el parser no lee casi nada, el script aborta (exit 3) y NO pisa el
# JSON bueno: el workflow queda en rojo y la pagina sigue funcionando con el ultimo JSON valido
# (y, si el JSON faltara del todo, la pagina cae sola al Monitor completo).
on:
  push:
    branches: [main]
    paths:
      - 'data/monitor.xlsx'
      - 'fcn-letras.js'
      - 'fcn-bonos.js'
      - '.github/scripts/generar_cuanto_cobro.js'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: cuanto-cobro
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar xlsx
        run: npm install --no-save xlsx@0.18.5

      - name: Generar data/cuanto_cobro.json
        run: node .github/scripts/generar_cuanto_cobro.js

      # Un push hecho con el GITHUB_TOKEN no dispara otros workflows, asi que esto no se realimenta.
      # Vercel si despliega (la integracion Git reacciona a cualquier push a main).
      - name: Commit y push si cambio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cuanto_cobro.json
          if git diff --cached --quiet; then
            echo "Sin cambios en cuanto_cobro.json"
          else
            git commit -m "Actualizar cuanto_cobro.json (automatico)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
