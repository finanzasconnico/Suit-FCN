name: Actualizar REM del BCRA

# Guarda data/rem.json (mediana del REM: inflacion mensual, proximos 12/24 meses, TAMAR y tipo de cambio, mas la
# inflacion real ya publicada) para "¿Pesos o dolares?". El REM sale una vez por mes (~5º dia habil); el bot mira
# todos los dias habiles y solo commitea cuando cambia algo. Tambien a mano desde "Actions" → "Run workflow".
# Si el BCRA no entrega el Excel prueba la copia de Wayback Machine; si no hay ninguna, deja el ultimo REM bueno.
# Si el Excel cambia de formato el script aborta (exit 3) y NO pisa el JSON bueno.
on:
  schedule:
    - cron: '0 15 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: rem-bcra
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar xlsx
        run: npm install --no-save xlsx@0.18.5

      - name: Generar data/rem.json
        run: node .github/scripts/rem.js

      - name: Commit y push si cambio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rem.json
          if git diff --cached --quiet; then
            echo "Sin cambios en rem.json"
            exit 0
          fi
          git commit -m "REM del BCRA ($(date +%Y-%m-%d))"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            echo "push rechazado, reintento $i ..."
            sleep 5
          done
          echo "no se pudo pushear tras 5 intentos" && exit 1
