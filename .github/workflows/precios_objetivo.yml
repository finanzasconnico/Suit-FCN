name: Actualizar Precios Objetivo

# Corre 1 vez por mes (día 1, 09:00 UTC = 06:00 ART) y también se puede disparar a mano desde
# la pestaña "Actions" del repo (botón "Run workflow") — usalo para probar sin esperar al cron,
# sobre todo la primera vez, para confirmar que Yahoo no bloquea la IP de GitHub Actions.
on:
  schedule:
    - cron: '0 9 1 * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install yfinance pandas openpyxl --upgrade

      - name: Generar precios_objetivo.xlsx
        run: python .github/scripts/precios_objetivo.py

      - name: Commitear y pushear si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/precios_objetivo.xlsx
          if git diff --cached --quiet; then
            echo "Sin cambios en precios_objetivo.xlsx, no hay nada para commitear."
          else
            git commit -m "Actualizacion automatica de Precios Objetivo ($(date +%Y-%m-%d))"
            git push
          fi
