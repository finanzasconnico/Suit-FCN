<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valuación por Múltiplos — FCN Suite</title>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Hanken+Grotesk:wght@300;400;500;600&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
:root {
  --bg:      #081917;
  --surface: #0E2622;
  --surface2:#122B27;
  --border:  #1E3A34;
  --jade:    #1C8C5F;
  --jade-d:  rgba(28,140,95,.12);
  --ambar:   #DBA03C;
  --ambar-d: rgba(219,160,60,.12);
  --danger:  #C0453B;
  --danger-d:rgba(192,69,59,.12);
  --text:    #EAF1EE;
  --muted:   #6C817C;
  --dim:     #3C5752;
  --font-d:  'Spectral', Georgia, serif;
  --font-s:  'Hanken Grotesk', system-ui, sans-serif;
  --font-m:  'IBM Plex Mono', ui-monospace, monospace;
  --r: 6px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{font-family:var(--font-s);background:var(--bg);color:var(--text);font-size:13px;}

/* ── TOPBAR ── */
.topbar{height:48px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:12px;flex-shrink:0;}
.topbar-title{font-family:var(--font-d);font-size:16px;font-weight:300;color:var(--text);}
.topbar-title span{color:var(--ambar);}
.topbar-badge{font-size:9px;font-family:var(--font-m);letter-spacing:.1em;text-transform:uppercase;padding:2px 8px;border-radius:2px;border:1px solid rgba(28,140,95,.4);color:var(--jade);background:var(--jade-d);}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px;}
.ts-info{font-size:10px;color:var(--muted);}
.badge-warn{font-size:9px;font-family:var(--font-m);letter-spacing:.06em;padding:2px 8px;border-radius:2px;border:1px solid rgba(219,160,60,.4);color:var(--ambar);background:var(--ambar-d);}

/* ── TABS ── */
.tabs{flex-shrink:0;display:flex;gap:2px;padding:0 20px;background:var(--surface);border-bottom:1px solid var(--border);overflow-x:auto;}
.tab{padding:10px 14px;background:transparent;border:none;border-bottom:2px solid transparent;color:var(--muted);font-family:var(--font-s);font-size:12px;cursor:pointer;white-space:nowrap;transition:color .15s,border-color .15s;}
.tab:hover{color:var(--text);}
.tab.active{color:var(--text);border-bottom-color:var(--jade);}

/* ── LAYOUT ── */
.page{display:flex;flex-direction:column;height:100vh;}
.toolbar{flex-shrink:0;padding:12px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface);}
.search-wrap{position:relative;flex:1;min-width:160px;max-width:280px;}
.search-wrap input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:7px 10px 7px 30px;color:var(--text);font-family:var(--font-s);font-size:12px;outline:none;transition:border-color .2s;}
.search-wrap input:focus{border-color:var(--jade);}
.search-icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:11px;pointer-events:none;}
.mult-pick{display:flex;align-items:center;gap:6px;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);white-space:nowrap;}
.mult-pick select{background:var(--bg);border:1px solid var(--border);border-radius:var(--r);color:var(--text);font-family:var(--font-s);font-size:12px;padding:6px 8px;outline:none;cursor:pointer;text-transform:none;letter-spacing:0;}
.mult-pick select:focus{border-color:var(--jade);}
.filter-chips{display:flex;gap:4px;flex-wrap:wrap;}
.chip{padding:4px 11px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:var(--font-s);font-size:11px;cursor:pointer;transition:all .15s;white-space:nowrap;}
.chip:hover{border-color:rgba(28,140,95,.4);color:var(--text);}
.chip.active{border-color:var(--jade);background:var(--jade-d);color:var(--jade);}
.counter{font-size:11px;color:var(--muted);margin-left:auto;white-space:nowrap;flex-shrink:0;}
.counter strong{color:var(--text);}

/* ── TABLE AREA ── */
.table-wrap{flex:1;overflow:auto;}
table{width:100%;border-collapse:collapse;}
thead th{position:sticky;top:0;background:var(--surface);z-index:10;padding:9px 12px;text-align:left;font-size:10px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none;}
thead th:hover{color:var(--text);}
thead th.num{text-align:right;}
thead th .sort-arrow{display:inline-block;margin-left:4px;opacity:.35;font-size:9px;}
thead th.sorted{color:var(--jade);}
thead th.sorted .sort-arrow{opacity:1;}
tbody tr{border-bottom:1px solid rgba(30,58,52,.5);transition:background .1s;}
tbody tr:hover{background:var(--surface2);}
tbody td{padding:9px 12px;vertical-align:middle;}
tbody td.num{text-align:right;font-family:var(--font-m);font-size:11.5px;}
.td-ticker{font-family:var(--font-m);font-size:12px;font-weight:500;color:var(--text);cursor:pointer;}
.td-ticker:hover{text-decoration:underline;text-decoration-color:var(--ambar);}
.tk-badge{font-family:var(--font-m);font-size:9px;color:var(--ambar);margin-left:5px;}
.td-empresa{font-size:12px;color:var(--text);max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.td-sector{font-size:10.5px;color:var(--muted);white-space:nowrap;}
.mult-badge{display:inline-block;font-size:9px;font-family:var(--font-m);padding:2px 6px;border-radius:3px;letter-spacing:.03em;background:rgba(107,163,255,.1);color:#6BA3FF;border:1px solid rgba(107,163,255,.25);}
.corr-pos{color:var(--jade);}
.corr-neg{color:var(--danger);}
.corr-none{color:var(--dim);}
.mm-above{color:var(--jade);}
.mm-below{color:var(--danger);}
.dash{color:var(--dim);}

/* ── EMPTY STATE ── */
#empty-state{display:none;flex-direction:column;align-items:center;justify-content:center;flex:1;padding:60px 20px;text-align:center;gap:14px;}
.empty-icon{font-size:3rem;opacity:.4;}
.empty-title{font-family:var(--font-d);font-size:20px;font-weight:300;color:var(--text);}
.empty-sub{font-size:12px;color:var(--muted);line-height:1.8;max-width:400px;}
.empty-sub code{font-family:var(--font-m);font-size:11px;background:var(--surface2);padding:2px 6px;border-radius:3px;border:1px solid var(--border);color:var(--ambar);}

/* ── HOLDERS MODAL ── */
.holders-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:500;align-items:center;justify-content:center;}
.holders-overlay.open{display:flex;}
.holders-modal{background:var(--surface2);border:1px solid var(--border);border-radius:10px;width:100%;max-width:460px;max-height:80vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.5);}
.hm-head{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.hm-title{font-family:var(--font-d);font-size:16px;color:var(--text);}
.hm-sub{font-size:10.5px;color:var(--muted);margin-top:2px;}
.hm-close{background:transparent;border:none;color:var(--muted);font-size:18px;cursor:pointer;line-height:1;padding:4px;}
.hm-close:hover{color:var(--text);}
.hm-body{padding:14px 18px;overflow-y:auto;}
.hm-empty{font-size:12px;color:var(--muted);line-height:1.7;text-align:center;padding:20px 0;}
.hm-table{width:100%;border-collapse:collapse;font-size:11.5px;}
.hm-table th{text-align:left;font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:0 0 8px;font-weight:500;}
.hm-table td{padding:7px 0;border-top:1px solid rgba(30,58,52,.5);color:var(--text);}
.hm-total{margin-top:12px;padding-top:10px;border-top:1px solid var(--border);font-size:11.5px;color:var(--muted);text-align:right;}
.hm-total b{color:var(--jade);}

/* ── NOTA PIE ── */
.foot-note{flex-shrink:0;padding:7px 20px;background:var(--surface);border-top:1px solid var(--border);font-size:10px;color:var(--dim);line-height:1.5;}
</style>
</head>
<body>
<div class="page" id="page">

  <div class="topbar">
    <div class="topbar-title">FCN · <span>Valuación por Múltiplos</span></div>
    <span class="topbar-badge">Research</span>
    <div class="topbar-right">
      <span class="ts-info" id="ts-info"></span>
      <span class="badge-warn" id="badge-warn" style="display:none">⚠ Desactualizado — regenerá el archivo</span>
      <a href="FCN_Suite.html" onclick="fcnIrArchivos(event)" style="color:inherit;text-decoration:underline;font-size:11px;" title="Subir un archivo nuevo o publicarlo para todo el equipo">🗂 Archivos</a>
    </div>
  </div>

  <div class="tabs" id="tabs" style="display:none"></div>

  <div class="toolbar" id="toolbar" style="display:none">
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="search-input" placeholder="Buscar ticker o empresa…" oninput="render()">
    </div>
    <label class="mult-pick" id="mult-pick">Múltiplo
      <select id="mult-sel" onchange="setMult(this.value)">
        <option value="auto">Según sector</option>
        <option value="PE">P/E</option>
        <option value="PS">P/S</option>
        <option value="EVEBITDA">EV/EBITDA</option>
        <option value="PFCF">P/FCF</option>
        <option value="PB">P/B</option>
      </select>
    </label>
    <div class="filter-chips" id="sector-chips"></div>
    <button class="chip" id="chip-cartera" onclick="toggleCartera()" style="display:none">Solo en cartera</button>
    <span class="counter" id="counter"></span>
  </div>

  <div id="empty-state">
    <div class="empty-icon">⚖️</div>
    <div class="empty-title">Sin datos de valuación</div>
    <div class="empty-sub">
      Subí <code>valuacion_multiplos.xlsx</code> desde
      <a href="FCN_Suite.html" onclick="fcnIrArchivos(event)" style="color:inherit;text-decoration:underline;"><strong>FCN Suite → Archivos</strong></a>,
      o esperá a que lo genere el bot semanal (GitHub Actions, datos de Yahoo Finance).
    </div>
  </div>

  <div class="table-wrap" id="table-wrap" style="display:none">
    <table id="main-table"><thead id="thead"></thead><tbody id="tbody"></tbody></table>
  </div>

  <div class="foot-note" id="foot-note" style="display:none"></div>

  <div class="holders-overlay" id="holdersOverlay" onclick="if(event.target===this) cerrarHolders()">
    <div class="holders-modal">
      <div class="hm-head">
        <div><div class="hm-title" id="hmTicker">—</div><div class="hm-sub" id="hmSub"></div></div>
        <button class="hm-close" onclick="cerrarHolders()">✕</button>
      </div>
      <div class="hm-body" id="hmBody"></div>
    </div>
  </div>

</div>

<script>
// ══════════════════════════════════════════
//  NAV A ARCHIVOS (embebido o suelto) — igual que Precios Objetivo
// ══════════════════════════════════════════
function fcnIrArchivos(e){
  if(e) e.preventDefault();
  try{ if(window.parent && window.parent!==window && typeof window.parent.showFiles==='function'){ window.parent.showFiles(); return; } }catch(err){}
  (window.top||window).location.href='FCN_Suite.html';
}

// ══════════════════════════════════════════
//  INDEXED DB — copiado del Suite
// ══════════════════════════════════════════
const DB_NAME='fcn_shared_v1', DB_STORE='files';
function openSharedDB(){
  return new Promise((res,rej)=>{
    const req=indexedDB.open(DB_NAME,1);
    req.onupgradeneeded=e=>e.target.result.createObjectStore(DB_STORE);
    req.onsuccess=e=>res(e.target.result);
    req.onerror=()=>rej(new Error('IndexedDB no disponible'));
  });
}
async function getSharedFile(key){
  try{
    const db=await openSharedDB();
    return new Promise(res=>{
      const tx=db.transaction(DB_STORE,'readonly');
      const req=tx.objectStore(DB_STORE).get(key);
      req.onsuccess=()=>res(req.result||null);
      req.onerror=()=>res(null);
    });
  }catch{ return null; }
}

// ══════════════════════════════════════════
//  BROADCAST CHANNEL
// ══════════════════════════════════════════
const BC=(typeof BroadcastChannel!=='undefined')?new BroadcastChannel('fcn_shared'):null;
if(BC){
  BC.onmessage=e=>{
    if(e.data?.type==='file_updated' && e.data?.key==='valuacion_multiplos') setTimeout(loadAndRender,300);
    if(e.data?.type==='file_updated' && e.data?.rawKey==='tenencia') setTimeout(loadTenencia,300);
  };
}

// ══════════════════════════════════════════
//  MÚLTIPLOS + MAPEO POR SECTOR
// ══════════════════════════════════════════
const MULT = {
  PE:       { label:'P/E',       tab:'PER'       },
  PS:       { label:'P/S',       tab:'P/S'       },
  EVEBITDA: { label:'EV/EBITDA', tab:'EV/EBITDA' },
  PFCF:     { label:'P/FCF',     tab:'P/FCF'     },
  PB:       { label:'P/B',       tab:'P/B'       },
};
const MULT_ORDER = ['PE','PS','EVEBITDA','PFCF','PB'];

// Strings de sector tal como los devuelve Yahoo Finance (estilo GICS).
const SECTOR_MULTIPLOS = {
  'Financial Services':      ['PB','PE'],
  'Technology':              ['PS','EVEBITDA','PFCF','PE'],
  'Communication Services':  ['PS','EVEBITDA','PFCF','PE'],
  'Consumer Cyclical':       ['PE','EVEBITDA','PFCF'],
  'Consumer Defensive':      ['PE','EVEBITDA','PFCF'],
  'Healthcare':              ['PE','EVEBITDA','PFCF'],
  'Industrials':             ['PE','EVEBITDA','PB'],
  'Energy':                  ['EVEBITDA','PB','PFCF'],
  'Basic Materials':         ['EVEBITDA','PB','PFCF'],
  'Utilities':               ['PE','EVEBITDA','PB'],
  'Real Estate':             [],   // fuera de v1 (usa P/FFO, no estos múltiplos)
};
const DEFAULT_MULTIPLOS = ['PE','EVEBITDA','PS'];

function multiplosDeSector(sector){
  if(sector && sector in SECTOR_MULTIPLOS) return SECTOR_MULTIPLOS[sector];
  return DEFAULT_MULTIPLOS;
}

// ══════════════════════════════════════════
//  ESTADO
// ══════════════════════════════════════════
let allRows=[];
let activeTab='Múltiplos';
let activeSector='todos';
let multSel='auto';                 // 'auto' (según sector) | 'PE' | 'PS' | 'EVEBITDA' | 'PFCF' | 'PB'
let soloCartera=false, _carteraTocado=false;
let sortState={};   // { tabName: {col, asc} }
let dataTenencia=[], holdersByTicker={};
let FOOT_BASE='';

const TABS=['Múltiplos','Técnico'];

// ══════════════════════════════════════════
//  HELPERS DE CÁLCULO
// ══════════════════════════════════════════
// Un múltiplo <=0, null, '' o NaN no sirve para comparar contra el promedio
// (en el Excel de ejemplo NFLX traía P/FCF = 0 / -1 y ensuciaba todo).
function num(v){
  if(v===null||v===undefined||v==='') return null;
  const n=Number(v);
  return (isNaN(n)) ? null : n;
}
function mult(v){
  const n=num(v);
  return (n===null || n<=0) ? null : n;
}
function corr(actual,prom){
  if(actual===null||prom===null) return null;
  return prom/actual - 1;
}
function precioObj(precio,actual,prom){
  if(precio===null||actual===null||prom===null) return null;
  return precio * prom/actual;
}
function fmtN(v,dec){
  if(v===null||v===undefined||isNaN(v)) return null;
  return Number(v).toLocaleString('es-AR',{minimumFractionDigits:dec??2,maximumFractionDigits:dec??2});
}
function corrCell(c){
  if(c===null) return '<span class="corr-none">—</span>';
  const pct=c*100;
  const cls=pct>=0?'corr-pos':'corr-neg';
  return `<span class="${cls}">${pct>=0?'+':''}${fmtN(pct,1)}%</span>`;
}
function nCell(v,dec){
  const s=fmtN(v,dec);
  return s===null?'<span class="dash">—</span>':s;
}

// ══════════════════════════════════════════
//  TENENCIA POR TICKER (solo para "qué clientes lo tienen") — nunca se publica
// ══════════════════════════════════════════
function construirHolders(){
  holdersByTicker={};
  dataTenencia.forEach(row=>{
    const ticker=String(row['Ticker']||'').trim().toUpperCase();
    if(!ticker) return;
    (holdersByTicker[ticker]=holdersByTicker[ticker]||[]).push({
      cliente:row['Cuenta']||row['Comitente']||'—',
      asesor:row['Asesor']||'',
      tenencia:parseFloat(row['Tenencia'])||0,
      nominales:parseFloat(row['Nominales'])||0,
    });
  });
}
function holdersFor(r){
  return holdersByTicker[String(r.ticker||'').toUpperCase()]
      || holdersByTicker[String(r.tickerUsado||'').toUpperCase()] || [];
}
function abrirHolders(ticker){
  if(!ticker) return;
  const holders=holdersByTicker[String(ticker).toUpperCase()]||[];
  document.getElementById('hmTicker').textContent=ticker;
  document.getElementById('hmSub').textContent=holders.length
    ? `${holders.length} cliente(s) posicionado(s)` : 'Ningún cliente tuyo lo tiene en cartera';
  const body=document.getElementById('hmBody');
  if(!holders.length){
    body.innerHTML=`<div class="hm-empty">Ningún cliente tuyo tiene <b>${ticker}</b> en cartera actualmente.`
      +(dataTenencia.length?'':' (Subí "Tenencia por Ticker" una vez en el FCN Suite para ver esto acá.)')+`</div>`;
  }else{
    const rows=holders.slice().sort((a,b)=>b.tenencia-a.tenencia).map(h=>`
      <tr><td>${h.cliente}</td><td>${h.asesor||'—'}</td>
      <td>US$ ${h.tenencia.toLocaleString('es-AR',{maximumFractionDigits:0})}</td>
      <td>${h.nominales.toLocaleString('es-AR')}</td></tr>`).join('');
    const total=holders.reduce((a,h)=>a+h.tenencia,0);
    body.innerHTML=`<table class="hm-table"><thead><tr><th>Cliente</th><th>Asesor</th><th>Tenencia</th><th>Nominales</th></tr></thead>`
      +`<tbody>${rows}</tbody></table>`
      +`<div class="hm-total">Total en cartera: <b>US$ ${total.toLocaleString('es-AR',{maximumFractionDigits:0})}</b></div>`;
  }
  document.getElementById('holdersOverlay').classList.add('open');
}
function cerrarHolders(){ document.getElementById('holdersOverlay').classList.remove('open'); }

async function loadTenencia(){
  const entry=await getSharedFile('tenencia');
  if(!entry||!entry.data) return;
  try{
    const wb=XLSX.read(entry.data,{type:'array'});
    const sn=wb.SheetNames.find(s=>s.toLowerCase().includes('export'))||wb.SheetNames[0];
    dataTenencia=XLSX.utils.sheet_to_json(wb.Sheets[sn],{defval:''});
    construirHolders();
    const chip=document.getElementById('chip-cartera');
    if(chip && dataTenencia.length){
      chip.style.display='';
      // por defecto arranca filtrado a lo que realmente tenemos en cartera
      if(!_carteraTocado){ soloCartera=true; chip.classList.add('active'); }
    }
    render();
  }catch(e){ console.warn('[Múltiplos] error leyendo tenencia',e); }
}

// ══════════════════════════════════════════
//  PARSE XLSX
// ══════════════════════════════════════════
function parseBuffer(entry){
  const wb=XLSX.read(entry.data,{type:'array'});
  const ws=wb.Sheets[wb.SheetNames[0]];
  const raw=XLSX.utils.sheet_to_json(ws,{defval:''});
  return raw.map(r=>{
    const g=(m,h)=>mult(r[`${m}_${h}`]);          // múltiplo (>0)
    const m={};
    MULT_ORDER.forEach(k=>{
      m[k]={ actual:g(k,'actual'), p3:g(k,'prom_3y'), p5:g(k,'prom_5y'), p10:g(k,'prom_10y') };
    });
    return {
      ticker:String(r['Ticker']||r['Ticker_usado']||'').trim(),
      tickerUsado:String(r['Ticker_usado']||'').trim(),
      empresa:String(r['Empresa']||'').trim(),
      sector:String(r['Sector']||'').trim(),
      moneda:String(r['Moneda']||'').trim(),
      precio:num(r['Precio_actual']),
      m,
      mm21:num(r['MM21_sem']), mm50:num(r['MM50_sem']), mm200:num(r['MM200_sem']),
      estado:String(r['Estado']||'').trim(),
      fuente:String(r['Fuente']||'').trim(),
      actualizado:String(r['Actualizado']||'').trim(),
    };
  }).filter(r=>r.ticker);
}

// múltiplo primario de un sector (siempre el mismo, tenga dato o no — así la tabla es predecible)
function multPrimario(sector){
  const prim=multiplosDeSector(sector);
  return prim[0] || DEFAULT_MULTIPLOS[0];
}
// qué múltiplo mostrar para una fila, según el selector
function multDeFila(r){
  return multSel==='auto' ? multPrimario(r.sector) : multSel;
}

// ══════════════════════════════════════════
//  TABS
// ══════════════════════════════════════════
function buildTabs(){
  const el=document.getElementById('tabs');
  el.innerHTML=TABS.map(t=>`<button class="tab ${t===activeTab?'active':''}" onclick="setTab('${t.replace(/'/g,"\\'")}')">${t}</button>`).join('');
}
function setTab(t){
  activeTab=t;
  buildTabs();
  render();
}

// ══════════════════════════════════════════
//  FILTROS
// ══════════════════════════════════════════
function buildSectorChips(){
  const secs=[...new Set(allRows.map(r=>r.sector).filter(Boolean))].sort();
  const el=document.getElementById('sector-chips');
  el.innerHTML=`<button class="chip ${activeSector==='todos'?'active':''}" onclick="setSector('todos')">Todos</button>`
    + secs.map(s=>`<button class="chip ${activeSector===s?'active':''}" onclick="setSector(${JSON.stringify(s).replace(/"/g,'&quot;')})">${s}</button>`).join('');
}
function setSector(s){ activeSector=s; buildSectorChips(); render(); }
function setMult(v){ multSel=v; render(); }
function toggleCartera(){
  soloCartera=!soloCartera;
  _carteraTocado=true;
  document.getElementById('chip-cartera').classList.toggle('active',soloCartera);
  render();
}

// filtro base (search + sector + cartera) — común a las dos pestañas.
// NO se filtra por "tiene dato o no": se muestran todos, con "—" donde falte.
function visibleRows(){
  const q=(document.getElementById('search-input')?.value||'').toLowerCase().trim();
  return allRows.filter(r=>{
    if(q && !r.ticker.toLowerCase().includes(q) && !r.empresa.toLowerCase().includes(q)) return false;
    if(activeSector!=='todos' && r.sector!==activeSector) return false;
    if(soloCartera && !holdersFor(r).length) return false;
    return true;
  });
}

// ══════════════════════════════════════════
//  SORT
// ══════════════════════════════════════════
function sortGetters(){
  if(activeTab==='Técnico'){
    return {
      ticker:r=>r.ticker, empresa:r=>r.empresa, sector:r=>r.sector, precio:r=>r.precio,
      mm21:r=>r.mm21, mm50:r=>r.mm50, mm200:r=>r.mm200,
      v21:r=>(r.precio!==null&&r.mm21)?r.precio/r.mm21-1:null,
      v50:r=>(r.precio!==null&&r.mm50)?r.precio/r.mm50-1:null,
      v200:r=>(r.precio!==null&&r.mm200)?r.precio/r.mm200-1:null,
    };
  }
  // Múltiplos: el múltiplo depende de la fila (modo auto) o es fijo (selector)
  const mk=r=>multDeFila(r);
  return {
    ticker:r=>r.ticker, empresa:r=>r.empresa, sector:r=>r.sector, mult:r=>MULT[mk(r)]?.label||'',
    precio:r=>r.precio,
    actual:r=>r.m[mk(r)]?.actual ?? null,
    p3:r=>r.m[mk(r)]?.p3 ?? null, p5:r=>r.m[mk(r)]?.p5 ?? null, p10:r=>r.m[mk(r)]?.p10 ?? null,
    c3:r=>corr(r.m[mk(r)]?.actual,r.m[mk(r)]?.p3),
    c5:r=>corr(r.m[mk(r)]?.actual,r.m[mk(r)]?.p5),
    c10:r=>corr(r.m[mk(r)]?.actual,r.m[mk(r)]?.p10),
    obj5:r=>precioObj(r.precio,r.m[mk(r)]?.actual,r.m[mk(r)]?.p5),
  };
}
function defaultSort(){
  return activeTab==='Técnico' ? {col:'v200',asc:true} : {col:'c5',asc:true};
}
function currentSort(){
  if(!sortState[activeTab]) sortState[activeTab]=defaultSort();
  return sortState[activeTab];
}
function sortBy(col){
  const s=currentSort();
  if(s.col===col) s.asc=!s.asc; else { s.col=col; s.asc=true; }
  render();
}
function applySort(rows){
  const s=currentSort();
  const get=sortGetters()[s.col]||(r=>r.ticker);
  const dir=s.asc?1:-1;
  return rows.slice().sort((a,b)=>{
    let va=get(a), vb=get(b);
    const na=(va===null||va===undefined||va===''), nb=(vb===null||vb===undefined||vb==='');
    if(na&&nb) return 0;
    if(na) return 1;            // vacíos siempre al final
    if(nb) return -1;
    if(typeof va==='string'||typeof vb==='string') return dir*String(va).localeCompare(String(vb));
    return dir*(va-vb);
  });
}

// ══════════════════════════════════════════
//  RENDER
// ══════════════════════════════════════════
function th(col,label,num){
  const s=currentSort();
  const arrow=s.col===col?(s.asc?'↑':'↓'):'↕';
  return `<th class="${num?'num ':''}${s.col===col?'sorted':''}" onclick="sortBy('${col}')">${label} <span class="sort-arrow">${arrow}</span></th>`;
}
function tkCell(r){
  const holders=holdersFor(r);
  const badge=holders.length?` <span class="tk-badge">👤${holders.length}</span>`:'';
  const esc=String(r.ticker).replace(/'/g,"\\'");
  return `<td class="td-ticker" onclick="abrirHolders('${esc}')" title="Ver qué clientes lo tienen">${r.ticker}${badge}</td>`;
}

function render(){
  const thead=document.getElementById('thead'), tbody=document.getElementById('tbody');
  if(!thead||!tbody) return;
  const rows=applySort(visibleRows());
  const pick=document.getElementById('mult-pick');
  if(pick) pick.style.display = activeTab==='Múltiplos' ? '' : 'none';

  let headHtml='', bodyHtml='', ncols=12;

  if(activeTab==='Técnico'){
    ncols=9;
    headHtml=`<tr>${th('ticker','Ticker')}${th('empresa','Empresa')}${th('sector','Sector')}${th('precio','Precio',1)}
      ${th('mm21','MM 21s',1)}${th('mm50','MM 50s',1)}${th('mm200','MM 200s',1)}
      ${th('v21','vs 21s',1)}${th('v50','vs 50s',1)}${th('v200','vs 200s',1)}</tr>`;
    const vs=(p,m)=>{
      if(p===null||!m) return '<span class="corr-none">—</span>';
      const d=p/m-1; return `<span class="${d>=0?'mm-above':'mm-below'}">${d>=0?'+':''}${fmtN(d*100,1)}%</span>`;
    };
    bodyHtml=rows.map(r=>`<tr>${tkCell(r)}
      <td class="td-empresa" title="${r.empresa}">${r.empresa||'—'}</td>
      <td class="td-sector">${r.sector||'—'}</td>
      <td class="num">${nCell(r.precio)}</td>
      <td class="num">${nCell(r.mm21)}</td><td class="num">${nCell(r.mm50)}</td><td class="num">${nCell(r.mm200)}</td>
      <td class="num">${vs(r.precio,r.mm21)}</td><td class="num">${vs(r.precio,r.mm50)}</td><td class="num">${vs(r.precio,r.mm200)}</td></tr>`).join('');

  }else{
    // MÚLTIPLOS — una sola tabla, el múltiplo lo fija el selector (o el sector en modo auto)
    const auto = multSel==='auto';
    ncols = auto ? 13 : 12;
    headHtml=`<tr>${th('ticker','Ticker')}${th('empresa','Empresa')}${th('sector','Sector')}`
      +(auto?th('mult','Múlt.'):'')
      +`${th('precio','Precio',1)}${th('actual','Actual',1)}${th('p3','Prom. 3Y',1)}${th('p5','Prom. 5Y',1)}${th('p10','Prom. 10Y',1)}`
      +`${th('c3','% corr. 3Y',1)}${th('c5','% corr. 5Y',1)}${th('c10','% corr. 10Y',1)}${th('obj5','P. objetivo 5Y',1)}</tr>`;
    bodyHtml=rows.map(r=>{
      const k=multDeFila(r);
      const mm=r.m[k]||{actual:null,p3:null,p5:null,p10:null};
      const badge=(auto && !r.sector) ? '<span class="dash">—</span>' : `<span class="mult-badge">${MULT[k]?.label||k}</span>`;
      return `<tr>${tkCell(r)}
        <td class="td-empresa" title="${r.empresa}">${r.empresa||'—'}</td>
        <td class="td-sector">${r.sector||'—'}</td>
        ${auto?`<td>${badge}</td>`:''}
        <td class="num">${nCell(r.precio)}</td>
        <td class="num">${nCell(mm.actual)}</td><td class="num">${nCell(mm.p3)}</td><td class="num">${nCell(mm.p5)}</td><td class="num">${nCell(mm.p10)}</td>
        <td class="num">${corrCell(corr(mm.actual,mm.p3))}</td><td class="num">${corrCell(corr(mm.actual,mm.p5))}</td><td class="num">${corrCell(corr(mm.actual,mm.p10))}</td>
        <td class="num">${nCell(precioObj(r.precio,mm.actual,mm.p5))}</td></tr>`;
    }).join('');
  }

  thead.innerHTML=headHtml;
  tbody.innerHTML=bodyHtml || `<tr><td colspan="${ncols}" style="padding:30px;text-align:center;color:var(--muted);">Sin filas para este filtro.</td></tr>`;

  // contador: cuántos de los visibles ya tienen el dato de esta vista
  let conDato;
  if(activeTab==='Técnico') conDato=rows.filter(r=>r.mm200!==null||r.mm50!==null).length;
  else conDato=rows.filter(r=>{const m=r.m[multDeFila(r)];return m&&m.actual!==null&&m.p5!==null;}).length;
  document.getElementById('counter').innerHTML=
    `<strong>${rows.length}</strong> tickers · <strong>${conDato}</strong> con datos`;

  // nota al pie
  let note=FOOT_BASE;
  const faltan=rows.length-conDato;
  if(activeTab==='Técnico'){
    note='Medias móviles = promedio del cierre semanal de las últimas 21 / 50 / 200 semanas (Yahoo). Verde: precio por encima de la media · rojo: por debajo.'
      + (faltan>0?` — ${faltan} todavía sin calcular.`:'');
  }else if(faltan>0){
    note=`⏳ ${faltan} de ${rows.length} sin múltiplos (ETFs, o papeles 100% argentinos sin ADR, que ninguna fuente gratis tiene). `+FOOT_BASE;
  }
  const fn=document.getElementById('foot-note'); if(fn) fn.innerHTML=note;
}

// ══════════════════════════════════════════
//  TIMESTAMP
// ══════════════════════════════════════════
function showTimestamp(ts,rows){
  // preferí la fecha "Actualizado" de los datos si está; si no, el mtime del archivo
  let base=ts;
  const fechas=(rows||[]).map(r=>r.actualizado).filter(Boolean).sort();
  if(fechas.length){ const d=new Date(fechas[fechas.length-1]+'T12:00:00'); if(!isNaN(d)) base=d.getTime(); }
  if(!base) return;
  const dias=Math.floor((Date.now()-base)/86400000);
  const txt=dias<=0?'hoy':dias===1?'hace 1 día':`hace ${dias} días`;
  document.getElementById('ts-info').textContent=`Última actualización: ${txt}`;
  if(dias>14) document.getElementById('badge-warn').style.display='inline';
}

// ══════════════════════════════════════════
//  LOAD & RENDER
// ══════════════════════════════════════════
async function fetchStaticFallback(url){
  try{
    const r=await fetch(url);
    if(!r.ok) return null;
    const buf=await r.arrayBuffer();
    const lastMod=r.headers.get('Last-Modified');
    return { data:buf, name:url.split('/').pop(), ts:lastMod?new Date(lastMod).getTime():Date.now() };
  }catch{ return null; }
}

async function loadAndRender(){
  let entry=await getSharedFile('valuacion_multiplos');
  if(!entry||!entry.data) entry=await fetchStaticFallback('data/valuacion_multiplos.xlsx');
  const show=(id,v)=>{const el=document.getElementById(id); if(el) el.style.display=v;};
  if(!entry||!entry.data){
    show('empty-state','flex'); show('table-wrap','none'); show('toolbar','none'); show('tabs','none'); show('foot-note','none');
    return;
  }
  try{ allRows=parseBuffer(entry); }
  catch(e){ console.error('Error parseando valuacion_multiplos:',e); return; }

  show('empty-state','none'); show('table-wrap','block'); show('toolbar','flex'); show('tabs','flex'); show('foot-note','block');

  const semilla=allRows.length && allRows.every(r=>r.fuente==='SEMILLA');
  FOOT_BASE=(semilla?'⚠ Datos de ejemplo (8 tickers de los Excel de referencia). El bot los reemplaza con la cartera completa en la próxima actualización. ':'')
    +'% corrección = (múltiplo promedio ÷ múltiplo actual) − 1. Negativo = el precio debería bajar para volver al promedio histórico; positivo = margen de suba. En "Según sector" cada empresa muestra el múltiplo más relevante para su rubro; con el selector podés fijar uno para toda la lista. Ojo: un P/E actual muy por encima de su promedio (ej. >100) casi siempre es una ganancia TTM golpeada por un cargo puntual, no una sobrevaluación real — mirá también P/S y EV/EBITDA.';
  document.getElementById('foot-note').innerHTML=FOOT_BASE;

  buildTabs();
  buildSectorChips();
  showTimestamp(entry.ts,allRows);
  render();
}

// ── INIT ──
loadAndRender();
loadTenencia();
</script>
